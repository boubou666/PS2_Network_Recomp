# ps2net game profile, generated by `ps2net scan --profile`. Edit freely.

[game]
serial = "SCES-51480"
boot = "SCES_514.80"
volume_id = "TMBO"

[network]
online = true
adapter = "smap"
stack_modules = ["NET/DEV9.IRX", "NET/EZNETCNF.IRX", "NET/EZNETCTL.IRX", "NET/INET.IRX", "NET/INETCTL.IRX", "NET/INETLOG.IRX", "NET/LIBNETB.IRX", "NET/MSIFRPC.IRX", "NET/NETCNF.IRX", "NET/PPP.IRX", "NET/PPPOE.IRX", "NET/SMAP.IRX"]
middleware = ["Medius 1.40.PRE8 1.40.0004", "SSL/TLS", "SCE-RT (rt_msg / DME) 1.06.0063"]
dnas = true
peer_to_peer = true

[dns]
# Original server = replacement host or IP. Empty keeps the original.
"tmbonline.scea.com" = ""
"tmbol-master.online.scee.com" = ""

