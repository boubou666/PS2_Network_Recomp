[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2net"
version = "0.1.0"
description = "Tooling for recompiling the online features of PlayStation 2 games"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

[project.scripts]
ps2net = "ps2net.__main__:main"

[tool.setuptools.packages.find]
include = ["ps2net*"]
